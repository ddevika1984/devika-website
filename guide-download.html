<!DOCTYPE html>
<!--
  Where the "Navratri Diet Plan" Payment Page's Redirect URL points, after
  the customer pays. Plain static file, not a serverless function, because
  this one has nowhere else to send anyone - unlike api/book.js it does
  not need to look anything up by product key or payment id.

  The Drive folder linked below must stay shared as "Anyone with the
  link, Viewer" (same rule as the Events/Guides sheets in CLAUDE.md) or a
  paying customer lands on Google's "Request access" screen instead of
  their file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download your guide — Dr. Devika Kamat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--rose:#AC6670;--cream:#F0ECDC;--ui:Poppins,system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#100D0C;color:var(--cream);font-family:var(--ui);font-weight:300;
    padding:32px 20px}
  .card{max-width:420px;text-align:center}
  .mono{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--rose);margin-bottom:18px}
  h1{font-size:28px;font-weight:400;margin:0 0 14px}
  p{font-size:15px;line-height:1.6;color:#cfc9b8;margin:0 0 32px}
  .btn{display:inline-block;padding:14px 32px;font-family:var(--mono);font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;background:var(--rose);color:#100D0C;
    text-decoration:none;border-radius:2px}
  .btn:hover{opacity:.9}
</style>
</head>
<body>
  <div class="card">
    <span class="mono">Dr. Devika Kamat</span>
    <h1>Thank you.</h1>
    <p>Your Navratri Diet Plan is ready. Tap below to open it.</p>
    <a class="btn" href="https://drive.google.com/drive/folders/1BieXQdGCcmRlu7Lcu-K3HPgNuTtXVoqs">Download your guide</a>
  </div>
</body>
</html>
